<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sum Check Protocol - Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input, button { margin: 5px 0; }
  #chart-container { width: 80%; max-width: 700px; margin-top: 20px; }
  .log { margin-top: 15px; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>Sum Check Protocol Visualization</h2>

<label>Inserisci numeri interi a tua scelta, senza spazi e separati da virgola:</label><br>
<input type="text" id="numbers" placeholder="esempio: 2,3,5, ..."><br>
<button onclick="addProof()">Proof</button>

<div class="log" id="log"></div>

<div id="chart-container">
    <canvas id="sumChart"></canvas>
</div>

<script>
let proofs = []; // Keep track of each proof
let chart;

function initChart() {
    const ctx = document.getElementById('sumChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: 'Prover Evaluations',
                    data: [],
                    backgroundColor: 'blue'
                },
                {
                    label: 'Claimed Sum',
                    data: [],
                    type: 'line',
                    borderColor: 'red',
                    fill: false
                }
            ]
        },
        options: {
            scales: {
                x: { title: { display: true, text: 'Challenge Point r' }, min: 0, max: 1 },
                y: { title: { display: true, text: 'Polynomial Value P(r)' } }
            }
        }
    });
}

function addProof() {
    const log = document.getElementById("log");
    const numbersInput = document.getElementById("numbers").value;
    if (!numbersInput) {
        alert("Enter numbers for the Prover.");
        return;
    }
    const numbers = numbersInput.split(',').map(n => parseInt(n.trim(), 10));

    const claimedSum = numbers.reduce((a, b) => a + b, 0);
    const r = Math.random(); // Verifier chooses random challenge point

    // Prover evaluates polynomial at r
    let P_r = numbers.reduce((sum, num, i) => sum + num * Math.pow(r, i), 0);

    log.innerHTML += `<p>Verifier chooses r=${r.toFixed(3)}, Prover evaluates P(r)=${P_r.toFixed(3)}</p>`;

    // Add data point to chart
    proofs.push({r, P_r, claimedSum});

    chart.data.datasets[0].data.push({x: r, y: P_r});
    
    // Update claimed sum line (horizontal)
    chart.data.datasets[1].data = [
        {x: 0, y: claimedSum},
        {x: 1, y: claimedSum}
    ];

    chart.update();
}

// Initialize chart on page load
initChart();
</script>

</body>
</html>
